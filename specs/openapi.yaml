        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  # ───────────────────────── WORLD: CIUDADES ─────────────────────────
  /world/cities:
    get:
      operationId: listCities
      tags: [world]
      summary: Ciudades del mundo
      description: |
        Las ciudades son el **único consumidor final** de la economía. Crecen (o decaen)
        según el índice de suministro histórico; su crecimiento es un objetivo estratégico
        observable por todos los jugadores de la región.
      parameters:
        - name: region_id
          in: query
          schema:
            $ref: '#/components/schemas/RegionId'
        - name: min_level
          in: query
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Ciudades.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/cities/{cityId}:
    get:
      operationId: getCity
      tags: [world]
      summary: Detalle de una ciudad
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CityId'
      responses:
        '200':
          description: Ciudad.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/City'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/cities/{cityId}/demand:
    get:
      operationId: getCityDemand
      tags: [world]
      summary: Curva de demanda vigente de una ciudad
      description: |
        Demanda dinámica por producto (GDD 5.6):
        `Demanda_efectiva = D0(producto, nivel) × factor_saturación(oferta_reciente)`.
        El precio actual está acotado por los clamps del producto. Recalculada
        periódicamente por el Economy Balancer, que publica las solicitudes de compra
        de la ciudad por la API estándar del Contract Service.
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CityId'
        - name: product_id
          in: query
          schema:
            $ref: '#/components/schemas/ProductId'
      responses:
        '200':
          description: Curvas de demanda activas de la ciudad.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CityDemand'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  # ───────────────────────── WORLD: SUELO ─────────────────────────
  /world/concessions:
    get:
      operationId: listConcessions
      tags: [world]
      summary: Concesiones de suelo propias
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ConcessionStatus'
        - name: region_id
          in: query
          schema:
            $ref: '#/components/schemas/RegionId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Concesiones de la corporación.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Concession'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }
    post:
      operationId: createConcession
      tags: [world]
      summary: Obtener una concesión de suelo
      description: |
        Todo terreno es **concesión renovable del sistema** (plazo de referencia: 90 días
        de juego) — no existe propiedad perpetua del suelo (GDD 11.1). El canon periódico
        es un sink estructural; su cuantía deriva del `canon_base` regional ajustado por
        ubicación. El primer canon se cobra al conceder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConcessionCreate'
      responses:
        '201':
          description: Concesión otorgada; primer canon asentado en el ledger.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Concession'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: La parcela solicitada se solapa con una concesión vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/concessions/{concessionId}:
    get:
      operationId: getConcession
      tags: [world]
      summary: Detalle de una concesión
      parameters:
        - name: concessionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ConcessionId'
      responses:
        '200':
          description: Concesión.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Concession'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/concessions/{concessionId}/renew:
    post:
      operationId: renewConcession
      tags: [world]
      summary: Renovar una concesión
      description: Extiende la concesión otro periodo pagando el canon vigente (asiento `canon` del ledger).
      parameters:
        - name: concessionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ConcessionId'
      responses:
        '200':
          description: Concesión renovada.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Concession'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La concesión ya está revertida al sistema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Saldo insuficiente para el canon (`INSUFFICIENT_FUNDS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/concession-transfers:
    post:
      operationId: createConcessionTransfer
      tags: [world]
      summary: Traspasar una concesión a otra corporación
      description: Mercado secundario de traspasos (GDD 11.1); el sistema cobra una tasa (`system_fee`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConcessionTransferCreate'
      responses:
        '201':
          description: Traspaso ejecutado.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/ConcessionTransfer'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  # ───────────────────────── WORLD: EDIFICIOS Y PRODUCCIÓN ─────────────────────────
  /world/buildings:
    get:
      operationId: listBuildings
      tags: [world, production]
      summary: Edificios propios
      parameters:
        - name: region_id
          in: query
          schema:
            $ref: '#/components/schemas/RegionId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BuildingStatus'
        - name: building_type_id
          in: query
          schema:
            $ref: '#/components/schemas/BuildingTypeId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Edificios de la corporación.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Building'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }
    post:
      operationId: createBuilding
      tags: [world, production]
      summary: Construir un edificio
      description: |
        Inicia la construcción sobre una concesión propia. Validación server-side de
        emplazamiento (espacio, acceso, recursos) contra las `placement_rules` del tipo
        y el grafo logístico — 422 `PLACEMENT_INVALID` si no se cumplen. El coste de
        construcción se asienta en el ledger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingCreate'
      responses:
        '201':
          description: Edificio en construcción (`under_construction`).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: 'Requisitos de emplazamiento no cumplidos (`PLACEMENT_INVALID`) o fondos insuficientes (`INSUFFICIENT_FUNDS`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/buildings/{buildingId}:
    parameters:
      - name: buildingId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BuildingId'
    get:
      operationId: getBuilding
      tags: [world, production]
      summary: Detalle de un edificio
      responses:
        '200':
          description: Edificio.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }
    patch:
      operationId: updateBuilding
      tags: [world, production]
      summary: Configurar un edificio
      description: Cambia la receta activa (con `changeover_seconds` de la receta) o inicia mantenimiento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingUpdate'
      responses:
        '200':
          description: Edificio actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 'Receta no soportada por el tipo de edificio, o `min_city_level` no alcanzado por la ciudad cercana.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/buildings/{buildingId}/upgrade:
    post:
      operationId: upgradeBuilding
      tags: [world, production]
      summary: Mejorar el nivel de un edificio
      description: |
        Progresión **por escala, no por desbloqueo** (GDD 6.3): sube el nivel (líneas
        paralelas, velocidad, eficiencia) con coste no lineal según la `level_curve`
        del tipo. El coste se asienta en el ledger.
      parameters:
        - name: buildingId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BuildingId'
      responses:
        '200':
          description: Mejora iniciada.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Building'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Nivel máximo ya alcanzado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Fondos insuficientes (`INSUFFICIENT_FUNDS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/buildings/{buildingId}/inventory:
    get:
      operationId: getBuildingInventory
      tags: [world, production]
      summary: Inventario físico de un edificio
      description: |
        Vista **física** del stock por producto. El stock comprometible (libre/reservado)
        se consulta en las cuentas del ledger (`/ledger/accounts`); la reconciliación
        física↔contable es periódica (ADR-004).
      parameters:
        - name: buildingId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BuildingId'
      responses:
        '200':
          description: Inventario por producto.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryItem'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/buildings/{buildingId}/production-batches:
    parameters:
      - name: buildingId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BuildingId'
    get:
      operationId: listProductionBatches
      tags: [world, production]
      summary: Cola de producción de un edificio
      description: El progreso del lote en curso es analítico (derivado bajo demanda), no por tick.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BatchStatus'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Lotes encolados/en curso.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductionBatch'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }
    post:
      operationId: queueProductionBatches
      tags: [world, production]
      summary: Encolar lotes de producción
      description: |
        Encola uno o varios lotes de una receta soportada por el edificio. La producción
        pausa sin combustible (`paused_no_fuel`) o con salarios impagados
        (`paused_no_workers`) — cascada de insolvencia sin deuda (GDD 5.9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionBatchCreate'
      responses:
        '201':
          description: Lotes encolados.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/ProductionBatch'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 'Insumos insuficientes, receta no soportada, o edificio no operativo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/production-batches/{batchId}:
    delete:
      operationId: cancelProductionBatch
      tags: [world, production]
      summary: Cancelar un lote encolado
      description: Cancela los lotes aún no producidos de la orden. Lo ya producido queda asentado.
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BatchId'
      responses:
        '200':
          description: Orden cancelada.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/ProductionBatch'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La orden ya está completada o cancelada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  # ───────────────────────── WORLD: FLOTA Y CARGAMENTOS ─────────────────────────
  /world/vehicle-types:
    get:
      operationId: listVehicleTypes
      tags: [world, fleet]
      summary: Catálogo de tipos de vehículo
      parameters:
        - name: mode

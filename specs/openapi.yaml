        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  # ───────────────────────── MARKET ─────────────────────────
  /market/ohlc:
    get:
      operationId: getMarketOhlc
      tags: [market]
      summary: Velas OHLC por producto y región
      description: |
        Historial de precios construido a partir de **contratos efectivamente liquidados**
        (no de órdenes vivas), agregado por producto y región. Referencia de precio de
        mercado visible para todos los jugadores. Buckets en sim-time.
      parameters:
        - name: product_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ProductId'
        - name: region_id
          in: query
          schema:
            $ref: '#/components/schemas/RegionId'
        - name: bucket_sim_secs
          in: query
          description: Tamaño del bucket en segundos de sim-time (p. ej. 3600 = 1 hora de juego).
          schema:
            type: integer
            format: int64
            minimum: 1
            default: 3600
        - name: from_sim
          in: query
          schema:
            $ref: '#/components/schemas/SimTime'
        - name: to_sim
          in: query
          schema:
            $ref: '#/components/schemas/SimTime'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Serie OHLC.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OhlcCandle'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }


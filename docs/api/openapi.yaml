  /world/vehicles/{vehicleId}:
    parameters:
      - name: vehicleId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/VehicleId'
    get:
      operationId: getVehicle
      tags: [world, fleet]
      summary: Detalle de un vehículo

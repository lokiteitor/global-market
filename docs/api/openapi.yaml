        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  # ───────────────────────── WORLD: RED ELÉCTRICA (Fase 3) ─────────────────────────
  /world/power-lines:
    get:
      operationId: listPowerLines
      tags: [world, power]
      summary: Catálogo de líneas de transmisión
      description: |
        Las líneas de transmisión conectan generadores y consumidores dentro de
        una región (pool regional, ADR-025): un edificio participa del mercado
        spot si está dentro del radio de conexión de una línea **operativa** de
        su región. Visibles para todos, como las terminales.
      parameters:
        - name: region_id
          in: query
          description: Filtra por región.
          schema:
            $ref: '#/components/schemas/RegionId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Líneas de transmisión.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PowerLine'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }
    post:
      operationId: createPowerLine
      tags: [world, power]
      summary: Construir una línea de transmisión
      description: |
        Da de alta una línea de transmisión propia. El trazado (`LineString`
        plano, metros de mundo) debe caer **íntegro dentro de una región** —las
        interconexiones interregionales son expansión futura (GDD 22)—. Las
        líneas **no requieren concesión de suelo** (cruzan muchas parcelas,
        como las carreteras): su coste de construcción es proporcional a la
        longitud (sink) y su **mantenimiento periódico por longitud** cumple el
        papel anti-acaparamiento del canon — impagado, la línea degrada y
        termina `abandoned` (deja de conducir; ADR-025).
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  description: Trazado GeoJSON-like `LineString` con coordenadas planas `[x_m, y_m]` (SRID 0, ADR-019); al menos 2 vértices.
                  type: object
      responses:
        '201':
          description: Línea construida (operational, condición 100).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/PowerLine'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Trazado inválido (`PLACEMENT_INVALID`, p. ej. cruza regiones) o fondos insuficientes (`INSUFFICIENT_FUNDS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/power-lines/{powerLineId}:
    get:
      operationId: getPowerLine
      tags: [world, power]
      summary: Detalle de una línea de transmisión
      parameters:
        - name: powerLineId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PowerLineId'
      responses:
        '200':
          description: Línea de transmisión.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/PowerLine'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/power-plants/{buildingId}/offer:
    put:
      operationId: setPowerOffer
      tags: [world, power]
      summary: Fijar el precio de oferta de una central propia
      description: |
        Fija el precio por unidad de energía al que la central oferta su
        capacidad en el mercado spot de su región. **Sin oferta publicada la
        central no participa** (ofertar es una decisión del jugador, como
        publicar en el tablón). La capacidad ofertable la deriva el tick: nivel
        de la central y, en las térmicas, el combustible disponible en su
        almacén — **sin combustible no despachan** (GDD 5.8).
      parameters:
        - name: buildingId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PowerPriceInput'
      responses:
        '200':
          description: Oferta fijada.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/PowerPrice'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/buildings/{buildingId}/power-bid:
    put:
      operationId: setPowerBid
      tags: [world, power]
      summary: Fijar la puja eléctrica máxima de un edificio propio
      description: |
        Fija la puja máxima por unidad de energía de un edificio consumidor.
        La puja es la **prioridad inversa del recorte** (menor puja = primero
        en recortarse ante déficit, con rotación entre pujas iguales, GDD 5.8)
        y el **techo personal**: el precio de cierre uniforme nunca supera la
        puja de un consumidor servido. Sin puja explícita rige el default del
        mundo (`II_POWER_DEFAULT_BID_PRICE`).
      parameters:
        - name: buildingId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PowerPriceInput'
      responses:
        '200':
          description: Puja fijada.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/PowerPrice'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/power/spot:
    get:
      operationId: listPowerSpotTicks
      tags: [world, power]
      summary: Histórico del mercado spot de una región
      description: |
        Ticks liquidados del mercado spot regional por orden de mérito
        (GDD 5.8): **el precio de cierre lo pagan todos los despachados**
        (precio marginal uniforme, no pay-as-bid). Más recientes primero.
      parameters:
        - name: region_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/RegionId'
        - name: before_sim
          in: query
          description: Solo ticks con `tick_sim` anterior a este sim-time.
          schema:
            $ref: '#/components/schemas/SimTime'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Ticks del spot.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PowerSpotTick'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/power/dispatches:
    get:
      operationId: listPowerDispatches
      tags: [world, power]
      summary: Despacho/consumo eléctrico de un edificio propio
      description: Registro por tick del edificio en el spot — como generador despachado o como consumidor servido — al precio de cierre. Solo edificios propios.
      parameters:

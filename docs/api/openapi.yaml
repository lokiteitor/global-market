            $ref: '#/components/schemas/ConcessionStatus'
        - name: region_id
          in: query
          schema:
            $ref: '#/components/schemas/RegionId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Concesiones de la corporación.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Concession'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }
    post:
      operationId: createConcession
      tags: [world]
      summary: Obtener una concesión de suelo
      description: |
        Todo terreno es **concesión renovable del sistema** (plazo de referencia: 90 días
        de juego) — no existe propiedad perpetua del suelo (GDD 11.1). El canon periódico
        es un sink estructural; su cuantía deriva del `canon_base` regional ajustado por
        ubicación. El primer canon se cobra al conceder.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConcessionCreate'
      responses:
        '201':
          description: Concesión otorgada; primer canon asentado en el ledger.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Concession'
                  meta:
                    $ref: '#/components/schemas/Meta'

                properties:
                  data:
                    $ref: '#/components/schemas/Vehicle'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'El vehículo pertenece a otra corporación, o está SELLADO durante un handoff (`VEHICLE_SEALED`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/vehicles/{vehicleId}/reposition:
    parameters:
      - name: vehicleId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/VehicleId'
    post:
      operationId: repositionVehicle
      tags: [world, fleet]
      summary: Reposicionar un vehículo (viaje EN VACÍO)
      description: |
        Pone en ruta un vehículo propio `idle` **sin carga** por una ruta propia que
        **empieza en su nodo actual**. Es el viaje en vacío (*deadhead*) del transporte
        real: el vehículo llega al nodo final de la ruta y queda `idle` allí, listo para
        cargar.

        **Por qué existe.** Un cargamento se entrega en el nodo destino del contrato y el
        vehículo se queda `idle` **ahí**; la carga siguiente, en cambio, nace donde está la
        mercancía (el almacén del vendedor, el origen de un flete). Sin viaje en vacío un
        vehículo solo podría moverse llevando carga y quedaría varado en el destino de su
        última entrega para siempre, incapaz de servir ningún contrato posterior.

        Valida **lo mismo** que el despacho, salvo lo relativo a la carga: propiedad del
        vehículo y de la ruta, vehículo `idle` y **sin cargamento a bordo** (un vehículo
        cargado se mueve despachando el cargamento, nunca por aquí), todos los tramos de la
        ruta del **modo** del vehículo, la ruta empieza en el nodo donde está el vehículo y
        el combustible cubre la distancia completa. Emite el hito `vehicle.repositioned`.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleReposition'
      responses:
        '200':
          description: Vehículo en tránsito hacia el nodo final de la ruta, en vacío.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Vehicle'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            El vehículo o la ruta pertenecen a otra corporación, o el vehículo está SELLADO
            durante un handoff (`VEHICLE_SEALED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'El vehículo no está `idle` (`VEHICLE_NOT_IDLE`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            `VALIDATION_ERROR`: la ruta no empieza en el nodo del vehículo, contiene tramos
            de otro modo, el vehículo lleva carga a bordo, o el combustible no cubre la
            distancia de la ruta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/shipments:
    get:
      operationId: listShipments
      tags: [world, fleet]
      summary: Cargamentos visibles (propios y los que se transportan por flete)
      description: |
        Cargamentos etiquetados por contrato: el stock reservado viaja sin dejar de estar
        reservado. **Nada se teletransporta, tampoco en los fallos** — el stock de un
        contrato fallido se libera en su ubicación física actual (`released_in_situ`).

        Devuelve los cargamentos **propios** y, en un **CCRI-Flete**, los que corresponden
        a la corporación como **transportista**: el dueño del cargamento es el cargador,
        pero quien lo despacha y lo lleva es el transportista (GDD 5.3.2), así que necesita
        verlo. Misma regla de autorización que `POST /world/shipments/{shipmentId}/dispatch`.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ShipmentStatus'
        - name: contract_id
          in: query
          schema:
            $ref: '#/components/schemas/ContractId'
        - name: freight_contract_id
          in: query
          description: Filtra por el CCRI-Flete del cargamento (el que un transportista debe despachar).
          schema:
            $ref: '#/components/schemas/FreightContractId'
        - name: vehicle_id
          in: query
          schema:
            $ref: '#/components/schemas/VehicleId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Cargamentos.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shipment'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/shipments/{shipmentId}:
    get:
      operationId: getShipment
      tags: [world, fleet]
      summary: Detalle de un cargamento
      description: |
        Visible para el dueño del cargamento y, en un CCRI-Flete, para su **transportista**
        (misma visibilidad que `GET /world/shipments`).
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ShipmentId'
      responses:
        '200':
          description: Cargamento.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Shipment'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /world/shipments/{shipmentId}/dispatch:
    parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ShipmentId'
    post:
      operationId: dispatchShipment
      tags: [world, fleet]
      summary: Despachar un cargamento (ejecución logística del CCRI)
      description: |
        El **vendedor** carga un cargamento propio (`in_warehouse`, situado en un nodo) en
        un vehículo propio `idle` que se encuentra en ese mismo nodo, y lo pone en ruta por
        una ruta propia hasta el nodo destino del contrato.

        **Nada se teletransporta.** Al despachar, el stock deja el almacén físico y pasa a
        viajar **a bordo del vehículo** (`in_transit`, etiquetado por su `contract_id`, sin
        dejar de estar reservado en el ledger — solo cambia su ubicación física). El motor
        de tránsito simula el avance segmento a segmento de la ruta (congestión física,
        consumo de combustible, desgaste y probabilidad de avería); **la llegada física del
        cargamento a su nodo destino es lo que confirma la entrega del CCRI** (emite
        `shipment.arrived`, que el Contract Service consume para liquidar lo entregado a
        plazo). Tampoco en los fallos hay teletransporte: si el contrato vence en tránsito,
        el stock se libera **en la ubicación física alcanzada** (`released_in_situ`).

        La ruta debe **empezar en el nodo del cargamento** y **terminar en el nodo destino
        del contrato**. Al despachar se valida —de una vez— que el vehículo tenga capacidad
        de carga para el volumen del cargamento y autonomía/combustible suficientes para la
        distancia completa de la ruta (de modo que una detención por falta de combustible en
        tránsito sea un caso puramente defensivo).
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentDispatch'
      responses:
        '200':
          description: Cargamento despachado (`in_transit`, con `vehicle_id` asignado).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Shipment'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            El cargamento o el vehículo pertenecen a otra corporación (autorización por
            propiedad), o el vehículo está SELLADO durante un handoff (`VEHICLE_SEALED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            El vehículo no está `idle`, o el cargamento ya no está `in_warehouse` (ya está
            en tránsito, entregado o liberado in situ).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            `VALIDATION_ERROR`: la ruta no empieza en el nodo del cargamento o no termina en
            el nodo destino del contrato; la capacidad del vehículo es insuficiente para el
            volumen del cargamento; o la autonomía/combustible no cubre la distancia de la
            ruta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  # ───────────────────────── WORLD: TERMINALES (Fase 2) ─────────────────────────

openapi: 3.2.0
$self: https://play.imperio-industrial.example/api/v1/openapi.yaml

info:
  title: Imperio Industrial — API pública
  version: 1.7.0
  summary: API REST del MMO de simulación económica, industrial y logística "Imperio Industrial".
  description: |
    API pública del servidor autoritativo de **Imperio Industrial** (GDD/SAD v1.2).

    ## Principios del contrato de API

    - **Una sola API para humanos y bots** (igualdad de API literal, ADR-010): mismos
      endpoints y mismos rate limits lógicos. El motor no distingue el origen de un comando.
    - **Servidor autoritativo**: el cliente solo envía intenciones; toda validación
      (espacio, fondos, stock, plazos) ocurre server-side.
    - **REST para operaciones no urgentes**; los eventos en tiempo real del área de interés
      (movimiento de vehículos, alertas configuradas) se distribuyen por **WebSocket**
      a través del Notification/Event Gateway y quedan fuera de este documento.
    - **El tablón global es pull, no push**: se consulta bajo demanda con filtros
      (producto, ubicación, precio, plazo); nunca hay push mundial de mercado.
    - **Sim-time en el contrato**: todo plazo de dominio (contratos, producción, viajes)
      se define y transmite en sim-time (segundos desde el génesis del mundo, ratio 24×).
      La traducción a tiempo real es responsabilidad exclusiva de la UI. Las dos únicas
      mecánicas en tiempo real son la ventana de sorteo y el cooldown anti-parpadeo.
    - **Dinero y stock como enteros/punto fijo serializados en strings** — nunca floats
      (invariante del ledger).
    - **Identificadores UUIDv7 planos, sin prefijo** (ADR-018), únicos globalmente e
      independientes del esquema donde residan. El contrato conserva schemas nominales
      por entidad (`AccountId`, `ContractId`, ...) para que el codegen produzca tipos
      distinguibles.
    - **Autorización por propiedad de recursos**: una corporación solo comanda sus
      edificios, vehículos y contratos (403 en caso contrario). Las cuentas de sistema
      (ciudades, banco central) operan por esta misma API sin canal privilegiado.

    ## Estructura de respuestas

    Toda respuesta exitosa envuelve el resultado en `{ "data": ..., "meta": ... }`,
    donde `meta` incluye `sim_time` y `server_time`. Los errores usan
    `{ "error": { "code", "message", "details" } }`.

    ## Ventana de mantenimiento

    El mundo pausa diariamente 10–30 min con sim-time congelado (ADR-003). Durante la
    ventana la API responde `503` con cabecera `Retry-After`. La pausa es económicamente
    transparente: ningún plazo de sim-time avanza.

    ## Changelog

    - **v1.7.0** (2026-07-21): **descubrimiento de terminales** — nuevo campo opcional
      `NetworkNode.terminal_id`: identifica la terminal intermodal del nodo, si la tiene.
      Hasta ahora el contrato solo permitía leer una terminal por su id
      (`GET /world/terminals/{terminalId}`) sin ninguna vía para descubrir ese id desde el
      grafo replicado, de modo que un cliente no podía inspeccionar la cola ni los slots del
      nodo seleccionado. Además se documenta el enrutado WS de los eventos `freight.*`
      (cargador y transportista) y `shipment.at_terminal` en `ws-protocol.md`. Cambios
      **aditivos** retrocompatibles.
    - **v1.6.0** (2026-07-21): **red eléctrica regional** (GDD 5.8 Fase 3, ADR-025) — se activa
      el último elemento diferido del diseño. Nuevos endpoints: `GET/POST /world/power-lines` y
      `GET /world/power-lines/{powerLineId}` (líneas de transmisión con huella LineString y
      mantenimiento, sin concesión de suelo), `PUT /world/power-plants/{buildingId}/offer`
      (precio de oferta del generador; sin oferta la central no participa),
      `PUT /world/buildings/{buildingId}/power-bid` (puja máxima del consumidor: prioridad
      inversa del recorte rotatorio y techo personal), `GET /world/power/spot` (histórico del
      tick del mercado spot por región: precio de cierre uniforme, despacho, recorte) y
      `GET /world/power/dispatches` (despacho/consumo propio por edificio). Campos **aditivos**:
      `BuildingType.power_generation` (parámetros de generación de las centrales),
      `Recipe.power_per_hour` (consumo eléctrico de recetas eléctricas — la convivencia con el
      combustible in situ es por receta: ninguna receta existente cambia) y el valor
      `paused_no_power` en el estado de `ProductionBatch` (pausa por falta de suministro:
      recorte del spot, insolvencia o desconexión — mismo 2º escalón de GDD 5.9). Cambios
      **aditivos** retrocompatibles.
    - **v1.5.0** (2026-07-21): **viaje en vacío** — nuevo `POST /world/vehicles/{vehicleId}/reposition`:
      pone en ruta un vehículo propio `idle` **sin carga** por una ruta propia que empieza
      en su nodo actual. Hasta ahora un vehículo solo podía moverse llevando un cargamento
      y, como la entrega lo deja `idle` en el nodo **destino** —donde no nace carga nueva—,
      quedaba varado allí de por vida: el dueño no podía cumplir ningún contrato posterior.
      El reposicionamiento (deadhead) cierra ese ciclo con las **mismas** reglas físicas del
      despacho (modo del vehículo, la ruta empieza donde está el vehículo, combustible para
      toda la distancia) y emite el hito `vehicle.repositioned`. Cambio **aditivo**
      retrocompatible.
    - **v1.4.1** (2026-07-21): **visibilidad del transportista** — `GET /world/shipments`
      (y el detalle) devuelve, además de los cargamentos propios, los que la corporación
      transporta como **transportista** de un CCRI-Flete (el dueño es el cargador, pero
      quien despacha es el transportista: sin verlos no podía ejecutar el flete aceptado),
      con nuevo filtro `freight_contract_id`. Además, dos campos que el contrato ya
      documentaba y la implementación no emitía: `declared_value` en las publicaciones
      `freight` del tablón (base de la garantía que valora el transportista antes de
      aceptar) y `freight_contract_id` en la aceptación servida de una publicación
      `freight`. Cambios **aditivos** retrocompatibles.
    - **v1.4.0** (2026-07-21): **CCRI-Flete activado** (GDD 5.3.2, antes diferido a Fase 2).
      Las publicaciones `kind: freight` son **solicitudes del cargador**: bloquean en escrow
      `quantity_total × unit_price` (la tarifa del flete por unidad) al publicar, declaran el
      **producto de la carga** en `product_id` (la custodia del ledger es por producto —
      corrige la documentación previa, que lo daba por ausente en fletes) y su
      `declared_value` es la base de la **garantía del transportista**, bloqueada al aceptar.
      La mercancía cargada pasa a una cuenta `custody`: el transportista la lleva físicamente
      pero **no puede venderla**. `GET /contracts/freight-contracts` devuelve los contratos
      reales. Los **slots de prioridad de terminal** quedan operativos
      (`POST /world/terminal-slots/{slotId}/purchase`): dan prioridad de transbordo.
    - **v1.3.0** (2026-07-17): nuevo endpoint `POST /world/shipments/{shipmentId}/dispatch`
      — **ejecución logística del CCRI**: el vendedor carga un cargamento propio en un
      vehículo propio `idle` situado en el nodo del cargamento y lo pone en ruta hasta el
      destino del contrato. **Nada se teletransporta**: el cargamento viaja físicamente a
      bordo (`in_transit`, etiquetado por su contrato, sin dejar de estar reservado) y su
      **llegada física al nodo destino confirma la entrega** del contrato. La cabecera
      `Idempotency-Key` queda uniformada en todos los mutantes de `logistics`/`fleet`.
      Cambios aditivos retrocompatibles.
    - **v1.2.0** (2026-07-16): cabecera opcional `Idempotency-Key` en todas las
      operaciones mutantes (reintentos seguros de comandos que mueven valor: misma
      clave ⇒ misma respuesta reproducida, nunca doble ejecución); nuevo campo
      opcional `AcceptanceCreate.origin_node_id` (requerido al aceptar publicaciones
      `buy`); semántica de entrega documentada — en contratos `sell` la entrega es
      **in situ** (`destination = origin`; el comprador recibe el stock en el almacén
      de origen), en `buy` el destino es el de la solicitud y exige transporte
      físico. Cambios aditivos retrocompatibles.
    - **v1.1.0** (2026-07-16): identificadores UUIDv7 planos, sin prefijo (ADR-018);
      geometría planar del mundo en metros, SRID 0 (ADR-019); backend unificado en Go
      (ADR-017). Sin cambios en rutas, verbos, envelopes ni semántica de endpoints.
    - **v1.0.0**: contrato inicial.
  contact:
    name: Equipo de Arquitectura / Backend — Imperio Industrial
    email: backend@imperio-industrial.example
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://play.imperio-industrial.example/api/v1
    description: Producción (vía Caddy, TLS). Los bots consumen exactamente esta misma superficie por un camino de red interno multiplexado.
  - url: https://stress.imperio-industrial.example/api/v1
    description: Cluster de stress test (entorno efímero y separado; nunca toca el mundo real).

security:
  - sessionToken: []

tags:
  # Módulos (nivel superior, convención /api/v1/{modulo}/{recurso})
  - name: auth
    summary: Autenticación e identidad
    description: Sesiones y cuentas. Jugadores, bots, ciudades y banco central comparten el mismo modelo de cuenta.
    kind: nav
  - name: ledger
    summary: Ledger de doble entrada
    description: Consulta de cuentas de valor (cash, escrow, garantías, stock comprometible) y extractos. Solo lectura por API — el valor solo se mueve mediante operaciones de dominio.
    kind: nav
  - name: contracts
    summary: Contract Service (CCRI)
    description: Tablón global, publicaciones, ventana de sorteo, contratos CCRI de bienes y CCRI-Flete (Fase 2).
    kind: nav
  - name: market
    summary: Historial de mercado
    description: Velas OHLC construidas a partir de contratos efectivamente liquidados (no de órdenes vivas).
    kind: nav
  - name: world
    summary: Mundo físico
    description: Regiones, catálogos, ciudades, concesiones, edificios, producción, flotas y cargamentos.
    kind: nav
  - name: logistics
    summary: Logistics Service
    description: Planificación sin estado de tránsito — topología del grafo, pathfinding jerárquico y ETAs informativas.
    kind: nav
  # Sub-agrupaciones
  - name: board
    summary: Tablón global de contratos
    description: Publicaciones, aceptaciones y ventana de sorteo del tablón único e interregional.
    parent: contracts
    kind: nav
  - name: fleet
    summary: Gestión de flotas
    description: Vehículos, cargamentos y su posición analítica derivada bajo demanda.
    parent: world
    kind: nav
  - name: production
    summary: Edificios y producción
    description: Edificios, recetas y colas de producción con progreso analítico.
    parent: world
    kind: nav
  - name: power
    summary: Red eléctrica regional
    description: Líneas de transmisión, ofertas de generación, pujas de consumo y el histórico del mercado spot por orden de mérito (GDD 5.8 Fase 3, ADR-025).
    parent: world
    kind: nav

paths:
  # ───────────────────────── AUTH ─────────────────────────
  /auth/sessions:
    post:
      operationId: createSession
      tags: [auth]
      summary: Iniciar sesión
      description: |
        Crea una sesión para una cuenta (humano o bot; credenciales por cuenta).
        Única capa del sistema donde el wall-clock es regla legítima.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '201':
          description: Sesión creada. El token se devuelve una única vez (el servidor solo almacena su hash).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/SessionCreated'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /auth/sessions/current:
    delete:
      operationId: deleteCurrentSession
      tags: [auth]
      summary: Cerrar la sesión actual
      responses:
        '204':
          description: Sesión invalidada.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /auth/me:
    get:
      operationId: getCurrentAccount
      tags: [auth]
      summary: Cuenta autenticada
      description: Devuelve la corporación asociada a la sesión actual.
      responses:
        '200':
          description: Cuenta actual.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  # ───────────────────────── LEDGER ─────────────────────────
  /ledger/accounts:
    get:
      operationId: listLedgerAccounts
      tags: [ledger]
      summary: Cuentas de valor propias
      description: |
        Cuentas del ledger de doble entrada cuyo titular es la corporación autenticada:
        `cash` (saldo líquido, nunca negativo — no existe deuda), `escrow`, `guarantee`,
        `stock_free`, `stock_reserved` y `custody`. El saldo es derivado y protegido por
        triggers; esta API es de solo lectura.
      parameters:
        - name: kind
          in: query
          description: Filtra por tipo de cuenta.
          schema:
            $ref: '#/components/schemas/LedgerAccountKind'
        - name: product_id
          in: query
          description: Filtra cuentas de stock por producto.
          schema:
            $ref: '#/components/schemas/ProductId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Cuentas del ledger de la corporación.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerAccount'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /ledger/accounts/{ledgerAccountId}/entries:
    get:
      operationId: listLedgerEntries
      tags: [ledger]
      summary: Extracto de una cuenta del ledger
      description: Partidas append-only de la cuenta (auditoría). Solo accesible por el titular.
      parameters:
        - name: ledgerAccountId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/LedgerAccountId'
        - name: from_sim
          in: query
          description: Sim-time mínimo del asiento.
          schema:
            $ref: '#/components/schemas/SimTime'
        - name: to_sim
          in: query
          description: Sim-time máximo del asiento.
          schema:
            $ref: '#/components/schemas/SimTime'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Partidas de la cuenta, de más reciente a más antigua.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerEntry'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  # ───────────────────────── CONTRACTS: TABLÓN ─────────────────────────
  /contracts/board:
    get:
      operationId: queryBoard
      tags: [contracts, board]
      summary: Consultar el tablón global (pull con filtros)
      description: |
        Tablón **único, global e interregional** (GDD 5.3.1). Devuelve publicaciones
        visibles (`draw_window`, `open`, `micro_window`) del canal `board`.
        Invariante por construcción: **toda publicación visible es ejecutable al 100%**
        (su garantía íntegra quedó bloqueada al publicar).
        Consulta bajo demanda — nunca hay suscripción push al tablón mundial.
      parameters:
        - name: kind
          in: query
          description: Tipo de publicación (`sell`, `buy` o `freight` — fletes desde Fase 2).
          schema:
            $ref: '#/components/schemas/PublicationKind'
        - name: product_id
          in: query
          schema:
            $ref: '#/components/schemas/ProductId'
        - name: origin_region_id
          in: query
          description: Región del nodo de origen.
          schema:
            $ref: '#/components/schemas/RegionId'
        - name: destination_region_id
          in: query
          description: Región del nodo de destino.
          schema:
            $ref: '#/components/schemas/RegionId'
        - name: max_unit_price
          in: query
          description: Precio unitario máximo (string de punto fijo).
          schema:
            $ref: '#/components/schemas/MoneyAmount'
        - name: min_unit_price
          in: query
          schema:
            $ref: '#/components/schemas/MoneyAmount'
        - name: min_quantity_remaining
          in: query
          schema:
            $ref: '#/components/schemas/StockQty'
        - name: max_delivery_sim_seconds
          in: query
          description: Plazo de entrega máximo aceptable, en sim-time.
          schema:
            $ref: '#/components/schemas/SimTime'
        - name: sort
          in: query
          schema:
            type: string
            enum: [unit_price_asc, unit_price_desc, published_at_desc, deadline_asc]
            default: unit_price_asc
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Página del tablón.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Publication'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /contracts/publications:
    post:
      operationId: createPublication
      tags: [contracts, board]
      summary: Publicar en el tablón (o negociar en privado)
      description: |
        Crea una publicación con su **garantía propia bloqueada íntegramente** en el
        mismo acto (ADR-014):

        - `sell`: stock congelado en el almacén de origen + garantía monetaria del 10%.
        - `buy`: 100% del pago retenido en escrow.
        - `freight` (Fase 2): escrow del flete (cargador) o garantía sobre valor declarado (transportista).

        Solo se publica sobre **stock que ya existe físicamente** (regla base del CCRI;
        no hay contratos sobre producción futura). Con `channel = private` la publicación
        solo es visible para `counterparty_account_id`, con las mismas garantías y liquidación.
        Al publicarse abre su ventana de sorteo (30–60 s reales).
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationCreate'
      responses:
        '201':
          description: Publicación creada, garantía bloqueada, ventana de sorteo abierta.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Publication'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: 'Garantía insuficiente o requisitos no cumplidos (p. ej. `INSUFFICIENT_COLLATERAL`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                insufficient-collateral:
                  summary: Garantía insuficiente
                  value:
                    error:
                      code: INSUFFICIENT_COLLATERAL
                      message: La garantía disponible no cubre la publicación solicitada
                      details: { required: "1000", available: "740" }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /contracts/publications/{publicationId}:
    parameters:
      - name: publicationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/PublicationId'
    get:
      operationId: getPublication
      tags: [contracts, board]
      summary: Detalle de una publicación
      responses:
        '200':
          description: Publicación.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Publication'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }
    delete:
      operationId: cancelPublication
      tags: [contracts, board]
      summary: Cancelar una publicación no aceptada
      description: |
        Cancela la cantidad restante y libera su garantía, respetando el **cooldown
        anti-parpadeo** (409 `CANCEL_COOLDOWN_ACTIVE` durante los primeros segundos tras
        publicar). La parte ya convertida en contrato aceptado no es cancelable.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200':
          description: Publicación cancelada; garantía restante liberada.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Publication'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'Cancelación dentro del cooldown anti-parpadeo, o publicación ya agotada/cancelada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                cooldown:
                  value:
                    error:
                      code: CANCEL_COOLDOWN_ACTIVE
                      message: La publicación no puede cancelarse durante el cooldown anti-parpadeo
                      details: { cancel_cooldown_until: "2026-07-15T10:00:42Z" }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }

  /contracts/publications/{publicationId}/acceptances:
    post:
      operationId: acceptPublication
      tags: [contracts, board]
      summary: Aceptar una publicación (total o parcial)
      description: |
        Registra una aceptación en la **ventana de sorteo** (ADR-011): las aceptaciones
        concurren durante la ventana; al cierre se sortea un orden aleatorio y se sirven
        hasta agotar la cantidad — **la latencia no otorga ventaja**. Aceptar K de N
        divide la publicación (contrato por K con garantías proporcionales).
        La garantía del aceptante se bloquea al aceptar y se libera si no resulta servido.
        Sobre una publicación madura (`open`), la aceptación abre una micro-ventana (15–30 s).

        **Semántica de entrega**: al aceptar una publicación `sell` la entrega es
        **in situ** — el contrato nace con `destination = origin` y el comprador
        recibe el stock como `stock_free` suyo en el propio almacén de origen
        (retirada in situ: él mismo lo transportará cuando lo necesite). Al aceptar
        una publicación `buy` el aceptante (vendedor) debe indicar `origin_node_id`
        — el almacén propio del que sale el stock —; el destino es el de la
        solicitud y la entrega exige transporte físico salvo que origen y destino
        coincidan.
      parameters:
        - name: publicationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PublicationId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceCreate'
      responses:
        '201':
          description: Aceptación registrada, pendiente del sorteo (`pending_draw`).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Acceptance'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Publicación agotada, cancelada o expirada (`PUBLICATION_EXHAUSTED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'Lote menor al mínimo de aceptación (`BELOW_MIN_LOT`) o garantía insuficiente (`INSUFFICIENT_COLLATERAL`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }


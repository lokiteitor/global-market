        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Maintenance' }
    patch:
      operationId: updateVehicle
      tags: [world, fleet]
      summary: Comandar un vehículo
      description: |
        Asigna/retira una ruta o programa mantenimiento. Un vehículo `sealed`
        (SELLADO durante un handoff entre shards) es visible pero **no comandable**:
        responde 403 `VEHICLE_SEALED` (solo aplica tras la extracción multi-proceso).
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'

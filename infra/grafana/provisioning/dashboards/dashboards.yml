# Provider de dashboards: carga todo JSON montado en /var/lib/grafana/dashboards
apiVersion: 1

providers:
  - name: imperio
    orgId: 1
    folder: Imperio Industrial
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

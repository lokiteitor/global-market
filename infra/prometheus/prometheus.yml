# ══════════════════════════════════════════════════════════════════════════
# Imperio Industrial — Prometheus (perfil obs)
#
# Modo habitual (make dev): gateway y engine corren en el HOST con `make
# backend`; se scrapean vía host.docker.internal (extra_hosts en compose).
# Perfil full: descomentar los targets de red interna gateway:8080 /
# engine:8081 (o mantener ambos: los del host fallarán sin ruido).
# ══════════════════════════════════════════════════════════════════════════
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets:
          - host.docker.internal:8080
          # - gateway:8080   # perfil full (servicio en la red de compose)

  - job_name: engine
    static_configs:
      - targets:
          - host.docker.internal:8081
          # - engine:8081    # perfil full (servicio en la red de compose)

  - job_name: bots
    static_configs:
      - targets:
          - host.docker.internal:8082

  # Harness de stress test (GDD §13.4 modo 3): EFÍMERO por naturaleza — solo
  # existe mientras dura la corrida (`make stress` en el host, `make
  # stress-docker` en el perfil compose "stress"), así que `up{job="stress"}=0`
  # es el estado normal fuera de una corrida. Se listan los dos targets a
  # propósito: el que no esté levantado falla sin ruido.
  - job_name: stress
    static_configs:
      - targets:
          - host.docker.internal:8083 # make stress (proceso en el host)
          - stress:8083               # make stress-docker (perfil "stress")
